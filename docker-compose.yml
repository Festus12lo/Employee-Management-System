services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems-backend
    restart: unless-stopped
    environment:
      - DEBUG=False
      - SECRET_KEY=ems-docker-production-secret-key-change-me
      - ALLOWED_HOSTS=*
      - CORS_ALLOW_ALL_ORIGINS=True
      - PORT=8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000/api
    container_name: ems-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
